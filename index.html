<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Film salvati</title>
  <meta name="description" content="La libreria di film e serie di Alessio: visti, da vedere, dove trovarli.">
  <link rel="stylesheet" href="style.css?v=2">
</head>
<body>
  <header class="top">
    <h1>Film salvati</h1>
    <p class="count" id="count"></p>
  </header>

  <form class="filters" id="filters" onsubmit="return false">
    <input type="search" name="q" placeholder="Cerca titolo, attore, regista…" aria-label="Cerca">
    <select name="status" aria-label="Stato"><option value="">Tutti gli stati</option></select>
    <select name="type" aria-label="Tipo">
      <option value="">Film e serie</option><option value="movie">Film</option><option value="tv">Serie</option>
    </select>
    <select name="genre" aria-label="Genere"><option value="">Tutti i generi</option></select>
    <select name="country" aria-label="Paese per lo streaming">
      <option value="NL">Streaming in Olanda</option><option value="IT">Streaming in Italia</option>
    </select>
    <select name="service" aria-label="Servizio"><option value="">Qualsiasi servizio</option></select>
    <select name="runtime" aria-label="Durata">
      <option value="">Qualsiasi durata</option><option value="90">Fino a 1h30</option>
      <option value="120">Fino a 2h</option><option value="150">Fino a 2h30</option>
    </select>
    <select name="decade" aria-label="Decennio"><option value="">Tutti i decenni</option></select>
    <select name="lang" aria-label="Lingua originale"><option value="">Tutte le lingue</option></select>
    <select name="sort" aria-label="Ordina">
      <option value="title">Ordina: titolo</option><option value="year">Ordina: più recenti</option>
      <option value="rating">Ordina: voto</option><option value="saves">Ordina: più salvati</option>
    </select>
  </form>

  <main class="grid" id="grid"></main>

  <dialog class="sheet" id="sheet"><div id="sheet-body"></div></dialog>

  <footer class="foot">
    Dati di film e serie da <a href="https://www.themoviedb.org/" target="_blank" rel="noopener">TMDB</a>,
    disponibilità streaming da <a href="https://www.justwatch.com/" target="_blank" rel="noopener">JustWatch</a>.
    Questo sito usa le API di TMDB ma non è approvato né certificato da TMDB.
  </footer>

  <script src="app.js?v=2"></script>
  <script src="js/notes-widget.js?v=1"></script>
</body>
</html>
